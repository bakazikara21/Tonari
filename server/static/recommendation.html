<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のおすすめ</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 12px 16px 32px;
        font-family: -apple-system, "Hiragino Sans", sans-serif;
        background: #FFFDF8;
        color: #111;
        -webkit-text-size-adjust: 100%;
    }
    main { max-width: 560px; margin: 0 auto; }
    [hidden] { display: none !important; }
    .title { margin: 0 0 8px; font-size: 32px; font-weight: bold; }
    .weather { margin: 0 0 14px; font-size: 24px; color: #333; }
    .question { margin: 0 0 12px; font-size: 30px; font-weight: bold; line-height: 1.4; }
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choices button {
        width: 100%;
        min-height: 72px;
        border-radius: 18px;
        font-size: 28px;
        font-weight: bold;
        border: 3px solid transparent;
        background: #C2410C;
        color: #fff;
    }
    .choices button.secondary { background: #fff; color: #1F2937; border-color: #1F2937; }
    .items { display: flex; flex-direction: column; gap: 28px; margin-bottom: 20px; }
    .item { padding-bottom: 24px; border-bottom: 2px solid #E7E5E4; }
    .item:last-child { border-bottom: none; padding-bottom: 0; }
    .rank { margin: 0 0 8px; font-size: 24px; font-weight: bold; color: #9A3412; }
    .photo {
        display: block;
        width: 100%;
        height: 30vh;
        object-fit: cover;
        border-radius: 20px;
        border: 2px solid #ddd;
    }
    .name { margin: 14px 0 6px; font-size: 32px; line-height: 1.3; }
    .price { margin: 0 0 14px; font-size: 30px; font-weight: bold; color: #333; }
    .reason {
        margin: 0;
        padding: 14px 16px;
        border-radius: 14px;
        background: #FFF1E6;
        font-size: 26px;
        line-height: 1.5;
    }
    .family-note { margin: 0 0 16px; font-size: 20px; line-height: 1.5; color: #9A3412; }
    .message { margin: 15vh 0 24px; text-align: center; font-size: 30px; font-weight: bold; line-height: 1.5;
               white-space: pre-line; }   /* 文の中の改行で折り返す */
</style>
</head>
<body>
<main>
    <p class="title">今日のおすすめ</p>
    <p class="weather" hidden></p>

    <!-- ① 今日つかうお金の量(3段階) -->
    <section class="step-budget" hidden>
        <p class="question">今日は どのくらい<br>お金を つかいますか?</p>
        <div class="choices budgets"></div>
    </section>

    <!-- ② 今日の気分 -->
    <section class="step-mood" hidden>
        <p class="question">今日の 気分は<br>どうですか?</p>
        <div class="choices moods"></div>
        <div class="choices" style="margin-top: 10px;">
            <button class="secondary back" type="button">もどる</button>
        </div>
    </section>

    <!-- ③ おすすめ(点数の高い順に最大5品。購入や注文のボタンは置かない) -->
    <section class="card" hidden>
        <p class="family-note" hidden>ご家族の方へ: アレルギーなどの「お勧めの設定」が まだないため、アレルギーは 考えずに 選んでいます。「使い方」の いちばん下から 設定できます。</p>
        <div class="items"></div>
    </section>
    <p class="message" hidden></p>
    <div class="choices again" hidden>
        <button class="secondary restart" type="button">こたえなおす</button>
    </div>
</main>
<script>
// お金の量と気分を聞いてから、今日のおすすめ(最大5品)を読み込んで表示する。購入や注文のボタンは置かない。
(() => {
    "use strict";

    const weather = document.querySelector(".weather");
    const stepBudget = document.querySelector(".step-budget");
    const stepMood = document.querySelector(".step-mood");
    const card = document.querySelector(".card");
    const message = document.querySelector(".message");
    const again = document.querySelector(".again");
    const LOADING_ERROR = "いまは ひらけません。しばらくしてから もう一度 ひらいてください。";

    // 本人が選んだ答え
    const answer = { budget: null, mood: null };

    // 1つの画面だけを見せる
    function show(section) {
        for (const element of [stepBudget, stepMood, card, message, again]) element.hidden = true;
        section.hidden = false;
    }

    function showMessage(text, canRetry) {
        message.textContent = text;
        show(message);
        again.hidden = !canRetry;
    }

    function showWeather(maxTemperature) {
        if (typeof maxTemperature !== "number") return;
        weather.textContent = `今日の さいこう気温は ${Math.round(maxTemperature)}℃ です`;
        weather.hidden = false;
    }

    // 選択肢のボタンを並べる(文字は textContent で入れ、HTML として解釈しない)
    function renderChoices(container, items, onChoose) {
        items.forEach(({ code, label }) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.addEventListener("click", () => onChoose(code));
            container.append(button);
        });
    }

    // 要素を作って文字を入れる(文字は textContent で入れ、HTML として解釈しない)
    function element(tag, className, text) {
        const node = document.createElement(tag);
        node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    // 1品ぶんの表示(順位・写真・名前・値段・理由)
    function renderItem(item, index) {
        const box = element("article", "item");
        box.append(element("p", "rank", index === 0 ? "いちばんの おすすめ" : `${index + 1}ばんめ`));
        const photo = element("img", "photo");
        photo.src = item.imageUrl;
        photo.alt = item.name;
        box.append(photo);
        box.append(element("h2", "name", item.name));
        box.append(element("p", "price", `${item.price.toLocaleString("ja-JP")}円`));
        if (item.reason) box.append(element("p", "reason", item.reason));
        return box;
    }

    function showItems(data) {
        card.querySelector(".items").replaceChildren(...data.items.map(renderItem));
        // 家族の設定がまだないときは、アレルギーを考えずに選んだことを家族向けに伝える
        card.querySelector(".family-note").hidden = data.settingsSaved !== false;
        show(card);
        window.scrollTo(0, 0);
        again.hidden = false;
    }

    async function getJSON(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`status ${response.status}`);
        return response.json();
    }

    async function loadRecommendation() {
        showMessage("えらんでいます…", false);
        const query = new URLSearchParams(answer);
        try {
            const data = await getJSON(`/api/recommendation?${query}`);
            if (data.status === "ok") showItems(data);
            else showMessage("今日は おすすめできる品が ありません。", true);
        } catch (error) {
            showMessage(LOADING_ERROR, true);
        }
    }

    stepMood.querySelector(".back").addEventListener("click", () => show(stepBudget));
    again.querySelector(".restart").addEventListener("click", () => show(stepBudget));

    getJSON("/api/recommendation/today")
        .then(({ maxTemperature, budgets, moods }) => {
            showWeather(maxTemperature);
            renderChoices(stepBudget.querySelector(".budgets"), budgets, (code) => {
                answer.budget = code;
                show(stepMood);
            });
            renderChoices(stepMood.querySelector(".moods"), moods, (code) => {
                answer.mood = code;
                loadRecommendation();
            });
            show(stepBudget);
        })
        .catch(() => showMessage(LOADING_ERROR, false));
})();
</script>
</body>
</html>
